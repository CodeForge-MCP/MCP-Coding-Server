<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CodeForge MCP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #000000 0%, #00ff66 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 40px;
      font-family: 'Segoe UI', sans-serif;
      color: #00ff66;
    }
    .app-header {
      display: flex;
      align-items: center;
      width: 90%;
      max-width: 1200px;
      margin-bottom: 20px;
    }
    .app-header i { font-size: 38px; color: #00ff66; margin-right: 12px; }
    .app-header h2 { color: #00ff66; font-weight: 700; margin: 0; letter-spacing: 1px; }
    .glass-card {
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 255, 102, 0.3);
      color: #e0e0e0;
      border-radius: 16px;
      box-shadow: 0 0 18px rgba(0, 255, 102, 0.2);
      animation: fadeInUp 0.8s ease-out;
    }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .btn-hacker {
      background-color: #00ff66;
      color: #000;
      font-weight: bold;
      border: none;
      transition: all 0.2s;
    }
    .btn-hacker:hover {
      background-color: #00cc52;
      color: #fff;
      box-shadow: 0 0 14px #00ff66;
      transform: scale(1.03);
    }
    .neon-header { color: #00ff66; font-weight: bold; text-align: center; text-shadow: 0 0 6px #00ff66; }
    .json-key { color: #00ff66; }
    .json-value { color: #ffffff; }
    .json-string { color: #00e0ff; }
    .json-number { color: #ffcc00; }
    .json-boolean { color: #ff6666; }
    .json-null { color: #999999; }
    .output-section {
      background: #0b0b0b;
      border: 1px solid #00ff66;
      border-radius: 12px;
      padding: 20px;
      color: #00ff66;
      font-size: 0.95rem;
      box-shadow: inset 0 0 10px rgba(0,255,102,0.15);
      overflow-x: auto;
      white-space: pre-wrap;
      transition: all 0.3s;
    }
    .output-section.loading::before {
      content: "⏳ Running tool...";
      color: #00ff66;
      animation: blink 1.2s infinite alternate;
    }
    @keyframes blink { to { opacity: 0.3; } }
  </style>
</head>

<body>
  <div class="app-header">
    <i class="fa-solid fa-laptop-code"></i>
    <h2>CodeForge MCP</h2>
  </div>

  <div class="container py-3">
    <div class="row justify-content-center">
      <div class="col-lg-8 col-md-10">
        <div class="card glass-card p-4">
          <h1 class="neon-header mb-4">MCP Coding Server</h1>

          <div class="mb-3">
            <label for="tool" class="form-label">Choose Tool:</label>
            <select id="tool" class="form-select bg-dark text-light border-success">
              <option value="code_review">Code Review</option>
              <option value="code_refactor">Code Refactor</option>
              <option value="code_debug">Code Debug</option>
              <option value="full_pipeline">Full Pipeline</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="language" class="form-label">Language:</label>
            <input type="text" id="language" class="form-control bg-dark text-light border-success" value="python">
          </div>

          <div class="mb-3">
            <label for="input" class="form-label">Paste Your Code or Prompt:</label>
            <textarea id="input" class="form-control bg-dark text-light border-success" rows="8"></textarea>
          </div>

          <div class="d-grid mb-4">
            <button onclick="runTool()" id="runBtn" class="btn btn-hacker btn-lg shadow-sm">
              🚀 Run Tool
            </button>
          </div>

          <h4 class="mb-3">🧾 Output:</h4>
          <div id="output" class="output-section" style="min-height: 150px;"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ===================== CONFIG =====================
    const BASE_URL = "http://127.0.0.1:8000"; // matches server
    const API_KEY = "mysecureapikey"; // use same key as in .env / config.py

    // ===================== SYNTAX HIGHLIGHT =====================
    function syntaxHighlight(json) {
      if (typeof json !== 'string') json = JSON.stringify(json, undefined, 2);
      json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(\.\d+)?)/g, match => {
        let cls = 'json-number';
        if (/^"/.test(match)) cls = /:$/.test(match) ? 'json-key' : 'json-string';
        else if (/true|false/.test(match)) cls = 'json-boolean';
        else if (/null/.test(match)) cls = 'json-null';
        return `<span class="${cls}">${match}</span>`;
      });
    }

    // ===================== RUN TOOL =====================
    async function runTool() {
      const runBtn = document.getElementById("runBtn");
      const output = document.getElementById("output");
      const tool = document.getElementById("tool").value;
      const input = document.getElementById("input").value;
      const language = document.getElementById("language").value;

      const payload = tool === "code_generation" ? { prompt: input, language } : { code: input, language };

      output.classList.add("loading");
      output.innerHTML = "";
      runBtn.disabled = true;
      runBtn.innerText = "⚙️ Processing...";

      try {
        const endpoint = tool === "full_pipeline" ? "/run/full_pipeline" : `/run/${tool}`;
        const response = await fetch(BASE_URL + endpoint, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-API-Key": API_KEY
          },
          body: JSON.stringify(payload)
        });

        const result = await response.json();
        output.classList.remove("loading");

        if (response.ok) {
          output.innerHTML = syntaxHighlight(result);
        } else {
          output.innerHTML = `<span class='text-danger'>❌ Error: ${result.detail || 'Unknown error'}</span>`;
        }
      } catch (err) {
        output.classList.remove("loading");
        output.innerHTML = `<span class='text-danger'>⚠️ ${err.message}</span>`;
        console.error(err);
      } finally {
        runBtn.disabled = false;
        runBtn.innerText = "🚀 Run Tool";
      }
    }
  </script>
</body>
</html>
